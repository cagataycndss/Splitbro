version: '3.8'

services:
  mongodb:
    image: mongo:6-jammy
    container_name: splitbro_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: splitbro_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: splitbro_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped


  backend:
    build:
      context: ./splitbro-backend
    container_name: splitbro_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://rabbitmq:5672
    env_file:
      - ./splitbro-backend/.env
    depends_on:
      - redis
      - rabbitmq

    restart: unless-stopped

  frontend:
    build:
      context: ./splitbro-frontend
    container_name: splitbro_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  mobile:
    build:
      context: ./splitbro-mobile
    container_name: splitbro_mobile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
