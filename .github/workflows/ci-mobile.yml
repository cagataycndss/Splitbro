name: "📱 Mobile CI"

on:
  push:
    branches: [main, develop]
    paths:
      - "splitbro-mobile/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "splitbro-mobile/**"

# Aynı branch'te yeni push gelirse eski workflow'u iptal et
concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "🔍 Lint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: splitbro-mobile

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Node.js Setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: splitbro-mobile/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 ESLint
        run: npm run lint

  build:
    name: "🏗️ Build Check"
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: splitbro-mobile

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Node.js Setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: splitbro-mobile/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🌐 Expo Web Export
        run: npx expo export --platform web

  docker:
    name: "🐳 Docker Build"
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐳 Build Docker Image
        run: docker build -t splitbro-mobile:${{ github.sha }} ./splitbro-mobile

  notify:
    name: "✅ CI Complete"
    runs-on: ubuntu-latest
    needs: [lint, build, docker]
    if: always()

    steps:
      - name: 📊 CI Summary
        run: |
          echo "## 📱 Mobile CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker | ${{ needs.docker.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
